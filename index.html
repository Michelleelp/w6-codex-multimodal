<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image to Text</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="app">
      <h1>Image to Text</h1>

      <div class="image-grid">
        <section class="image-section" aria-labelledby="image-1-label">
          <h2 id="image-1-label">Image 1</h2>
          <input id="image-input-1" type="file" accept="image/*" aria-label="Choose Image 1" />
          <div id="preview-1" class="preview-area" aria-label="Image 1 preview"></div>
          <h3>Description</h3>
          <div id="result-1" class="result-area" aria-label="Image 1 description"></div>
        </section>

        <section class="image-section" aria-labelledby="image-2-label">
          <h2 id="image-2-label">Image 2</h2>
          <input id="image-input-2" type="file" accept="image/*" aria-label="Choose Image 2" />
          <div id="preview-2" class="preview-area" aria-label="Image 2 preview"></div>
          <h3>Description</h3>
          <div id="result-2" class="result-area" aria-label="Image 2 description"></div>
        </section>
      </div>

      <button type="button">Describe Images</button>
    </main>
  </body>
</html>
